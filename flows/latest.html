<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#11151d" />
  <title>Game UI Interactive Flow</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      display: grid;
      min-height: 100svh;
      place-items: center;
      color: #e8edf6;
      background: #11151d;
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }
    .loading {
      width: min(420px, calc(100vw - 36px));
      padding: 24px 20px;
      text-align: center;
    }
    .mark {
      width: 46px;
      height: 46px;
      margin: 0 auto 16px;
      border: 4px solid rgba(122, 205, 198, 0.18);
      border-top-color: #7adbd0;
      border-radius: 50%;
      animation: spin 860ms linear infinite;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 18px;
      line-height: 1.35;
    }
    p {
      margin: 0;
      color: #9faec4;
      font-size: 14px;
      line-height: 1.7;
    }
    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #11151d;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main id="loading" class="loading">
    <div class="mark" aria-hidden="true"></div>
    <h1>正在加载交互动画</h1>
    <p id="status">内容正在同步，请稍候...</p>
  </main>
  <script>
    const contentUrl = "./game-ui-flow-20261118101307-c00v7.html?v=20261118101307-c00v7";
    const status = document.getElementById("status");
    const loading = document.getElementById("loading");
    let attempts = 0;

    function cacheBust(url) {
      const separator = url.includes("?") ? "&" : "?";
      return url + separator + "v=" + Date.now();
    }

    async function waitForContent() {
      attempts += 1;
      const url = cacheBust(contentUrl);
      status.textContent = attempts <= 1
        ? "正在准备动画内容..."
        : "动画内容同步中，正在第 " + attempts + " 次重试...";
      try {
        const response = await fetch(url, { cache: "no-store" });
        const text = response.ok ? await response.text() : "";
        if (response.ok && /<html[\s>]/i.test(text) && /Game UI Interactive Flow|交互动画预览/i.test(text)) {
          const iframe = document.createElement("iframe");
          iframe.title = "交互动画预览";
          iframe.src = url;
          iframe.addEventListener("load", () => {
            loading.style.display = "none";
          }, { once: true });
          document.body.appendChild(iframe);
          return;
        }
      } catch {}
      setTimeout(waitForContent, attempts < 10 ? 1600 : 3000);
    }

    waitForContent();
  </script>
</body>
</html>
