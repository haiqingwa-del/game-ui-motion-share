  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100svh;
      margin: 0;
      color: #e8edf6;
      background: #11151d;
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }
    .stage-shell {
      display: grid;
      min-height: 100svh;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 14px;
      padding: 18px 14px;
    }
    header, footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }
    h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }
    .transport {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    button {
      min-height: 38px;
      padding: 0 13px;
      color: #edf2ff;
      background: #212b3b;
      border: 1px solid #3d485e;
      border-radius: 7px;
      font-weight: 700;
      cursor: pointer;
    }
    button:active {
      transform: translateY(1px);
    }
    .stage {
      display: grid;
      place-items: center;
      gap: 10px;
      min-height: 0;
      overflow: hidden;
    }
    .frame {
      position: relative;
      width: min(440px, calc((100svh - 154px) * var(--frame-ratio, 0.56)), 100%);
      aspect-ratio: var(--frame-aspect, 455 / 891);
      overflow: hidden;
      background:
        linear-gradient(45deg, rgba(255, 255, 255, 0.06) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(255, 255, 255, 0.06) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(255, 255, 255, 0.06) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(255, 255, 255, 0.06) 75%),
        #171d28;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
      background-size: 16px 16px;
      border: 1px solid #30384b;
      border-radius: 6px;
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.42);
      touch-action: manipulation;
    }
    canvas {
      display: block;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .flow-tabs {
      position: relative;
      display: grid;
      width: min(440px, 100%);
      min-height: 48px;
      gap: 8px;
      pointer-events: auto;
    }
    body[data-navigation="layer-hotspots"] .flow-tabs {
      display: none;
    }
    body[data-navigation="layer-hotspots"] .frame {
      cursor: pointer;
    }
    body[data-navigation="layer-hotspots"] footer {
      display: none;
    }
    .selected-plate {
      position: absolute;
      top: 0;
      height: 100%;
      z-index: 0;
      border: 1px solid #1b3f5f;
      border-radius: 8px;
      background: linear-gradient(180deg, #2f87ff 0%, #1d5fcb 100%);
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.45), 0 7px 18px rgba(18, 95, 220, 0.28);
      transition: left 260ms cubic-bezier(.2,.75,.2,1), filter 180ms;
      pointer-events: none;
    }
    .selected-plate.flash {
      filter: brightness(1.25) drop-shadow(0 0 13px rgba(121, 166, 255, 0.54));
    }
    .flow-tab {
      position: relative;
      z-index: 1;
      min-width: 0;
      min-height: 48px;
      padding: 0 10px;
      overflow: hidden;
      color: #c8d4ea;
      background: rgba(24, 32, 46, 0.92);
      border: 1px solid #3a465e;
      border-radius: 8px;
      font-size: clamp(12px, 2.8vw, 15px);
      font-weight: 900;
      letter-spacing: 0;
      text-shadow: 0 2px #090c14;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .flow-tab[aria-selected="true"] {
      color: #fff;
      background: transparent;
    }
    .flow-tab span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: transform 120ms cubic-bezier(.1,.8,.4,1);
    }
    .flow-tab:active span {
      transform: translateY(4px) scale(.96);
    }
    .tap-marker {
      position: absolute;
      z-index: 12;
      width: 54px;
      height: 54px;
      border: 3px solid #fff;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.16);
      box-shadow: 0 0 0 10px rgba(117, 185, 255, 0.18);
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -50%);
    }
    .tap-marker.show {
      animation: tap 540ms ease-in-out forwards;
    }
    @keyframes tap {
      0% { opacity: 0; transform: translate(-50%, -60%) scale(1.15); }
      25% { opacity: .9; }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(.75); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.28); }
    }
    .status {
      min-height: 20px;
      color: #99a7be;
      font-size: 12px;
    }
    @media (max-width: 720px) {
      .stage-shell { padding: 10px; }
      header, footer { align-items: flex-start; flex-direction: column; }
      .frame {
        width: min(100%, calc((100svh - 194px) * var(--frame-ratio, 0.56)));
      }
    }
  </style>

        if (direction === "bottom") y += (1 - progress) * distanceY;
      }

      if (animation.fade && rawProgress < 1) alpha *= animation.flip ? 0.38 + rawProgress * 0.62 : rawProgress;
      if (animation.pop && rawProgress < 1) scale *= 0.68 + 0.32 * easeOutBack(rawProgress);
      if (animation.rotate && rawProgress < 1) rotation = (1 - progress) * -0.22;
      if (animation.flip && rawProgress < 1) {
        const flipPeak = Math.sin(rawProgress * Math.PI);
        const flipWave = Math.abs(Math.cos(rawProgress * Math.PI));
        const flipScale = Math.max(0.035, flipWave);
        scale *= 0.94 + 0.08 * flipPeak;
        rotation += (0.5 - rawProgress) * 0.16 * flipPeak;
        if (animation.flipAxis === "x") {
          scaleY *= flipScale;
          scaleX *= 1 + flipPeak * 0.06;
        } else {
          scaleX *= flipScale;
          scaleY *= 1 + flipPeak * 0.06;
        }
      }
      if (animation.pulse && rawProgress >= 1) scale *= 1 + Math.sin(localTime * Math.PI * 2) * 0.025;

      return {
        x,
        y,
        alpha: clamp(alpha),
        scale,
        scaleX,
        scaleY,
        rotation,
        flipProgress: animation.flip && rawProgress < 1 ? rawProgress : null,
        originX: animation.flip ? layer.transformOriginX : null,
        originY: animation.flip ? layer.transformOriginY : null,
      };
    }

    function drawFlipMotionCue(context, layer, animated) {
      if (!Number.isFinite(animated.flipProgress)) return;
      const peak = Math.sin(animated.flipProgress * Math.PI);
      if (peak <= 0.04) return;
      const scale = animated.scale || 1;
      const scaleX = Math.abs(animated.scaleX || 1);
      const scaleY = Math.abs(animated.scaleY || 1);
      const width = Math.max(2, layer.width * scale * scaleX);
      const height = Math.max(2, layer.height * scale * scaleY);
      const centerX = animated.x + layer.width / 2;
      const centerY = animated.y + layer.height / 2;
      const left = centerX - width / 2;
      const top = centerY - height / 2;
      context.save();
      context.globalCompositeOperation = "screen";
      context.globalAlpha = Math.min(0.42, animated.alpha * peak * 0.42);
      context.strokeStyle = "rgba(170, 245, 255, 0.95)";
      context.lineWidth = Math.max(1, Math.min(4, Math.max(width, height) * 0.035));
      context.strokeRect(left, top, width, height);
      context.fillStyle = "rgba(255, 255, 255, 0.7)";
      if (width < height) context.fillRect(centerX - 1.2, top, 2.4, height);
      else context.fillRect(left, centerY - 1.2, width, 2.4);
      context.restore();
    }

    function tabName(screen, index) {
      return (screen.name || "界面 " + (index + 1))
        .replace(/\.psd$/i, "")
        .replace(/\s*合成$/i, "")
        .trim() || "界面 " + (index + 1);
    }

    function syncFrameSize(screen) {
      const width = Math.max(1, Math.round(screen.width));
      const height = Math.max(1, Math.round(screen.height));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
      frame.style.setProperty("--frame-aspect", width + " / " + height);
      frame.style.setProperty("--frame-ratio", String(width / height));
    }

    function createMedia(layer) {
      if (mediaCache.has(layer.src)) {
        const cached = mediaCache.get(layer.src);
        return cached.promise || Promise.resolve(cached);
      }
      const isVideo = layer.mediaType === "video";
      const media = isVideo ? document.createElement("video") : new Image();
      const record = { element: media, ready: false, isVideo, promise: null };
      record.promise = new Promise((resolve) => {
        const done = () => {
          record.ready = true;
          resolve(record);
        };
        media.addEventListener(isVideo ? "loadeddata" : "load", done, { once: true });
        media.addEventListener("error", () => resolve(record), { once: true });
        if (isVideo) {
          media.muted = true;
          media.loop = true;
          media.playsInline = true;
          media.preload = "auto";
        }
        media.src = layer.src;
      });
      mediaCache.set(layer.src, record);
      return record.promise;
    }

    function preloadScreen(index) {
      const screen = project.screens[index];
      if (!screen) return Promise.resolve();
      if (!screenPreloadTasks.has(screen.id)) {
        screenPreloadTasks.set(screen.id, Promise.all(screen.layers.map(createMedia)));
      }
      return screenPreloadTasks.get(screen.id);
    }

    function preloadOtherScreens() {
      project.screens.forEach((screen, index) => {
        if (index !== activeIndex) {
          setTimeout(() => preloadScreen(index), 120 + index * 90);
        }
      });
    }

    function getLayerEndTime(layer) {
      return (Number(layer.start) || 0) + Math.max(0, Number(layer.duration) || 0);
    }

    function isLayerVisibleAtTime(layer, time) {
      if (!layer?.visible) return false;
      if (time < (Number(layer.start) || 0)) return false;
      if (time > getLayerEndTime(layer) && layer.holdAfterEnd === false) return false;
      return true;
    }

    function syncVideoLayerElement(element, layer, time) {
      const localTime = Math.max(0, time - (Number(layer.start) || 0));
      const intrinsicDuration = Number.isFinite(element.duration) && element.duration > 0 ? element.duration : null;
      const layerDuration = Math.max(0.01, Number(layer.duration) || intrinsicDuration || 0.01);
      const activeRangeTime = clamp(localTime, 0, layerDuration);
      let targetTime = activeRangeTime;
      if (intrinsicDuration) {
        targetTime = activeRangeTime >= layerDuration
          ? Math.min(intrinsicDuration - 0.04, activeRangeTime)
          : activeRangeTime % intrinsicDuration;
      }
      if (Number.isFinite(targetTime) && Math.abs((element.currentTime || 0) - targetTime) > 0.08) {
        try {
          element.currentTime = Math.max(0, targetTime);
        } catch {}
      }
      if (time >= (Number(layer.start) || 0) && time <= getLayerEndTime(layer)) {
        element.play().catch(() => {});
      } else {
        element.pause();
      }
    }

    function drawScreen(screen, time, now) {
      syncFrameSize(screen);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const gradient = ctx.createLinearGradient(0, 0, 0, screen.height);
      gradient.addColorStop(0, "#151918");
      gradient.addColorStop(1, "#101315");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, screen.width, screen.height);

      screen.layers.forEach((layer) => {
        if (!isLayerVisibleAtTime(layer, time)) return;
        const media = mediaCache.get(layer.src);
        if (!media?.ready) return;
        const element = media.element;
        if (media.isVideo) syncVideoLayerElement(element, layer, time);

        const animated = getLayerAnimationState(layer, time, screen);
        const centerX = animated.x + layer.width / 2;
        const centerY = animated.y + layer.height / 2;
        ctx.save();
        ctx.globalAlpha = animated.alpha;
        ctx.globalCompositeOperation = canvasBlendMode(layer.blendMode);
        if (Number.isFinite(animated.originX) && Number.isFinite(animated.originY)) {
          const originX = animated.originX + (animated.x - layer.x);
          const originY = animated.originY + (animated.y - layer.y);
          ctx.translate(originX, originY);
          ctx.rotate(animated.rotation);
          ctx.scale(animated.scale * animated.scaleX, animated.scale * animated.scaleY);
          ctx.drawImage(element, animated.x - originX, animated.y - originY, layer.width, layer.height);
        } else {
          ctx.translate(centerX, centerY);
          ctx.rotate(animated.rotation);
          ctx.scale(animated.scale * animated.scaleX, animated.scale * animated.scaleY);
          ctx.drawImage(element, -layer.width / 2, -layer.height / 2, layer.width, layer.height);
        }
        ctx.restore();
        drawFlipMotionCue(ctx, layer, animated);
      });

      const flashProgress = clamp((now - switchedAt) / 320);
      if (flashProgress < 1) {
        ctx.save();
        ctx.globalAlpha = (1 - flashProgress) * 0.22;
        ctx.fillStyle = "#74d8ff";
        ctx.fillRect(0, 0, screen.width, screen.height);
        ctx.restore();
      }
    }

    function renderTabs() {
      tabs.querySelectorAll(".flow-tab").forEach((button) => button.remove());
      if (useLayerHotspots) {
        tabs.hidden = true;
        return;
      }
      tabs.hidden = false;
      const count = Math.max(1, project.screens.length);
      const gap = 8;
      tabs.style.gridTemplateColumns = "repeat(" + count + ", minmax(0, 1fr))";
      plate.style.width = "calc((100% - " + gap * (count - 1) + "px) / " + count + ")";
      plate.style.left = "calc(" + activeIndex + " * ((100% - " + gap * (count - 1) + "px) / " + count + " + " + gap + "px))";
      plate.classList.remove("flash");
      void plate.offsetWidth;
      plate.classList.add("flash");
      project.screens.forEach((screen, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "flow-tab";
        button.setAttribute("role", "tab");
        button.setAttribute("aria-selected", String(index === activeIndex));
        const label = document.createElement("span");
        label.textContent = tabName(screen, index);
        button.appendChild(label);
        button.addEventListener("click", () => {
          const rect = frame.getBoundingClientRect();
          showTap(((index + 0.5) / project.screens.length) * rect.width, rect.height * 0.92);
          switchScreen(index);
        });
        tabs.appendChild(button);
      });
    }

    function showTap(x, y) {
      tapMarker.style.left = x + "px";
      tapMarker.style.top = y + "px";
      tapMarker.classList.remove("show");
      void tapMarker.offsetWidth;
      tapMarker.classList.add("show");
    }

    function restartVideos(screen) {
      screen.layers.forEach((layer) => {
        const media = mediaCache.get(layer.src);
        if (!media?.isVideo || !media.ready) return;
        try {
          media.element.currentTime = 0;
          media.element.pause();
        } catch {}
      });
    }

    function switchScreen(index) {
      activeIndex = (index + project.screens.length) % project.screens.length;
      const screen = project.screens[activeIndex];
      startedAt = performance.now();
      switchedAt = startedAt;
      title.textContent = screen.name || "交互动画预览";
      syncFrameSize(screen);
      renderTabs();
      status.textContent = "正在载入当前界面...";
      preloadScreen(activeIndex).then(() => {
        restartVideos(screen);
        status.textContent = "当前界面已载入";
      });
    }

    function findScreenHotspot(screen, x, y) {
      const hotspots = [...(screen.hotspots || [])].reverse();
      return hotspots.find((hotspot) =>
        x >= hotspot.x &&
        x <= hotspot.x + hotspot.width &&
        y >= hotspot.y &&
        y <= hotspot.y + hotspot.height
      ) || null;
    }

    function tick(now) {
      const screen = project.screens[activeIndex];
      const time = Math.max(0, (now - startedAt) / 1000);
      drawScreen(screen, time, now);
      status.textContent = (activeIndex + 1) + " / " + project.screens.length + " · " + time.toFixed(1) + "s";
      requestAnimationFrame(tick);
    }

    async function boot() {
      status.textContent = "正在载入首个界面...";
      await preloadScreen(0);
      status.textContent = "首个界面已载入，其他界面后台加载中";
      frame.addEventListener("click", (event) => {
        if (event.target.closest("button")) return;
        const rect = frame.getBoundingClientRect();
        const localX = event.clientX - rect.left;
        const localY = event.clientY - rect.top;
        if (useLayerHotspots) {
          const screen = project.screens[activeIndex];
          const canvasX = (localX / rect.width) * screen.width;
          const canvasY = (localY / rect.height) * screen.height;
          const hotspot = findScreenHotspot(screen, canvasX, canvasY);
          if (!hotspot) return;
          showTap(localX, localY);
          switchScreen(hotspot.targetScreenIndex);
          return;
        }
        const yRatio = localY / rect.height;
        if (yRatio < 0.82) return;
        const nextIndex = clamp(Math.floor((localX / rect.width) * project.screens.length), 0, project.screens.length - 1);
        showTap(localX, localY);
        switchScreen(nextIndex);
      });
      document.getElementById("prevBtn").addEventListener("click", () => switchScreen(activeIndex - 1));
      document.getElementById("nextBtn").addEventListener("click", () => switchScreen(activeIndex + 1));
      document.getElementById("replayBtn").addEventListener("click", () => switchScreen(activeIndex));
      switchScreen(0);
      if (!renderStarted) {
        renderStarted = true;
        requestAnimationFrame(tick);
      }
      preloadOtherScreens();
    }

    boot();
  </script>
</body>
</html>
